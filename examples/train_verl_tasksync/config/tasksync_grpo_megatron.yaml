# Configuration for training on task-sync environments with GRPO + Megatron backend.
#
# task-sync envs have: data.py + env.py + prompt.md (+ task_verification.py)
# Database is SQLite, generated by running data.py.
#
# TaskSyncTrainer uses standard data/rollout settings with task directory sources.

hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_megatron_trainer
  - _self_

data:
  # TaskSync sources: one task directory or a list of task directories.
  train_files: null
  val_files: null
  prompt_key: prompt
  reward_fn_key: data_source
  max_prompt_length: 5600
  max_response_length: 25600
  train_batch_size: 8
  val_batch_size: null
  seed: 42
  validation_shuffle: false
  tasksync:
    val_ratio: 0.0
    filter_pattern: null
    validate_on_discovery: false
  return_raw_chat: true
  return_raw_input_ids: false
  return_full_prompt: false
  shuffle: true
  dataloader_num_workers: 0
  filter_overlong_prompts: false
  truncation: error
  trust_remote_code: false

actor_rollout_ref:
  hybrid_engine: true

  # Task-sync specific options — consumed by TaskSyncAgentLoop + TaskSyncTrainer.
  env:
    data_py_timeout: 120
    ptc_timeout: 10
    max_tool_calls: 50
    reward_type: dense      # "dense" or "binary"
    # ptc_mode: "hybrid" -> all rollouts have programmatic_tool_call (plus direct env tools);
    #           "dtc" -> none do;
    #           "ptc" -> env tools reachable only via programmatic_tool_call
    # The training entry point selects the corresponding agent loop automatically.
    ptc_mode: hybrid
    tool_call_format: auto  # Dense Qwen3 launchers explicitly select XML
    # ptc_desc: "rich" -> full PTC tool description with examples;
    #           "minimal" -> one-liner (matches ptc-mini SFT data).
    ptc_desc: rich
    # Per-error penalty subtracted from final reward (PTC failures, plus rejected
    # direct calls in ptc mode). 0.0 disables; final reward is clipped
    # to >= 0 so the penalty can't flip a successful rollout negative.
    ptc_error_penalty: 0.0

  # Custom: how often to dump per-episode experiences (JSON). -1 disables.
  # Matches 0.7.0 safe default: disabled unless shell / CLI opts in.
  dump_experience_every: -1

  model:
    path: ???

  rollout:
    name: vllm
    mode: async

    prompt_length: 5600
    response_length: 25600
    max_model_len: 31200

    max_num_seqs: 256
    enable_chunked_prefill: true
    enforce_eager: false
    gpu_memory_utilization: 0.6

    n: 32
    temperature: 1.0
    calculate_log_probs: true

    log_prob_micro_batch_size_per_gpu: 1
    log_prob_use_dynamic_bsz: false
    log_prob_max_token_len_per_gpu: 31200

    agent:
      default_agent_loop: tasksync_agent
      num_workers: 8

  actor:
    loss_agg_mode: token-mean
    entropy_coeff: 0
    ppo_epochs: 1
    ppo_mini_batch_size: ${data.train_batch_size}
    ppo_micro_batch_size_per_gpu: 2
    use_rollout_log_probs: false

algorithm:
  adv_estimator: grpo
  gamma: 1.0
  lam: 1.0
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false

  filter_groups:
    enable: false
    metric: acc
    max_num_gen_batches: 10

trainer:
  project_name: gem-tasksync-training-verl
  experiment_name: tasksync_megatron
  logger: ["console", "wandb"]
  total_epochs: 2
  save_freq: 50
  test_freq: -1
  n_gpus_per_node: 8
  nnodes: 2
  resume_mode: auto
  val_before_train: false
  default_local_dir: checkpoints/${trainer.project_name}/${trainer.experiment_name}

  # Custom: switch reward from dense -> binary after N epochs. 0 disables.
  dense_epoch: 0

reward:
  reward_model:
    enable: false
    enable_resource_pool: false
